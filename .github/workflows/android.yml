name: Build Terlinux APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bundle OpenCode for Alpine ARM64
        run: |
          mkdir -p core/main/src/main/assets/opencode
          curl -fL https://github.com/anomalyco/opencode/releases/download/v1.19.5/opencode-linux-arm64-musl.tar.gz -o /tmp/opencode.tar.gz
          tar -xzf /tmp/opencode.tar.gz -C core/main/src/main/assets/opencode
          chmod +x core/main/src/main/assets/opencode/opencode

      - name: Build with Gradle
        run: ./gradlew --no-daemon assembleFdroidRelease

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/Fdroid/release/*.apk artifacts/Terlinux.apk

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: Terlinux-apk
          path: artifacts/Terlinux.apk